# Blueprint cho Render — Dashboard > New > Blueprint > chọn repo này.
# Region singapore để tránh Binance chặn IP Mỹ (lỗi 451).
services:
  - type: web
    name: bot-trade
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python main_render.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: TZ
        value: Asia/Ho_Chi_Minh
      - key: EXCHANGE_ID
        value: binance
      - key: RUN_ONCE
        value: "0"
      - key: ENABLE_API
        value: "1"
      # Chạy CẢ 2 bot trong 1 service
      - key: ENABLE_SENTINEL
        value: "1"
      # Sentinel bắt đầu muộn hơn V74 15 phút: đủ để 2 bot không cùng ngốn RAM,
      # mà không quá lâu (mỗi lần service ngủ dậy là đồng hồ này reset về 0)
      - key: SENTINEL_DELAY
        value: "900"
      # Giảm số coin Sentinel quét cho nhẹ RAM. Tăng lên 300 nếu thấy ổn.
      - key: LIMIT_SCAN
        value: "200"
      # Bot tự ping mình mỗi 10 phút để Render không cho service ngủ
      - key: PING_INTERVAL
        value: "600"
      # [2026-10-16d] Nguồn dữ liệu WebSocket: Binance ĐẨY nến 4H về, KHÔNG tốn
      # request weight => không còn bị "418 IP banned". "auto" = WS, chỉ quay về
      # REST nếu WebSocket hỏng hẳn. Đổi sang "rest" để quay lại cách cũ.
      - key: V74_DATA_SOURCE
        value: "auto"
      # Nạp lịch sử 150 nến/cặp rất chậm (60 request/phút) để không tạo đợt burst
      - key: WS_BACKFILL_RPM
        value: "60"
      # Quét rẻ (0 weight) nên quét dày hơn: 15 phút/lần cho app Android tươi dữ liệu
      - key: V74_INTERVAL
        value: "900"
      # [2026-10-17] Binance đang ban IP của Render tới ~00:xx 18/10 (418 trên
      # api.binance.com) nên backfill REST không nạp được 150 nến lịch sử =>
      # app trắng. Chuyển backfill sang mirror công khai, không chung giới hạn
      # IP với api.binance.com. Redeploy lần này cũng khởi động lại process =>
      # reset bộ đếm ban nội bộ (_banned_until), nên bot thử ngay qua mirror
      # thay vì tiếp tục chờ hết ban cũ.
      - key: BINANCE_DATA_MIRROR
        value: "1"
      # 3 biến dưới đây KHÔNG điền ở đây — vào Render > Environment nhập tay
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # [2026-10-19] Token xac thuc cho /ingest/v74 (may local day du lieu khi
      # Render bi ban IP). Repo nay la PUBLIC nen KHONG duoc dien gia tri o day.
      - key: INGEST_TOKEN
        sync: false
