# Blueprint cho Render — Dashboard > New > Blueprint > chọn repo này.
# Region singapore để tránh Binance chặn IP Mỹ (lỗi 451).
services:
  - type: web
    name: bot-trade
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python main_render.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: TZ
        value: Asia/Ho_Chi_Minh
      - key: EXCHANGE_ID
        value: binance
      - key: RUN_ONCE
        value: "0"
      - key: ENABLE_API
        value: "1"
      # Chạy CẢ 2 bot trong 1 service
      - key: ENABLE_SENTINEL
        value: "1"
      # Sentinel bắt đầu muộn hơn V74 30 phút để 2 bot không quét cùng lúc
      # (tránh chạm trần 512MB RAM của gói free)
      - key: SENTINEL_DELAY
        value: "1800"
      # Giảm số coin Sentinel quét cho nhẹ RAM. Tăng lên 300 nếu thấy ổn.
      - key: LIMIT_SCAN
        value: "200"
      # 2 biến dưới đây KHÔNG điền ở đây — vào Render > Environment nhập tay
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
