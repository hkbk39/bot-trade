name: Bot Sentinel (săn lazy coin để short)

on:
  schedule:
    # Lệch 25 phút so với V74 để 2 bot không chạy chồng nhau
    - cron: '25 * * * *'
  workflow_dispatch:

concurrency:
  group: bot-sentinel
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Lấy code
        uses: actions/checkout@v4

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cài thư viện
        run: pip install -r requirements.txt

      # Nhớ mức cảnh báo BTC của lần chạy trước, để tin "BTC HỒI PHỤC" còn bắn được
      - name: Khôi phục state
        uses: actions/cache/restore@v4
        with:
          path: sentinel_state.json
          key: sentinel-state-${{ github.run_id }}
          restore-keys: sentinel-state-

      - name: Chạy bot
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXCHANGE_ID:      ${{ vars.EXCHANGE_ID || 'binance' }}
          BINANCE_DATA_MIRROR: ${{ vars.BINANCE_DATA_MIRROR || '0' }}
          RUN_ONCE: '1'
          TZ: Asia/Ho_Chi_Minh
        run: python bot_sentinel.py

      - name: Lưu state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: sentinel_state.json
          key: sentinel-state-${{ github.run_id }}
